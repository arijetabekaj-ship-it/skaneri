<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kërko me zë</title>
<style>
/* Voice search for the visits app. It only hears words: the app finds the items and keeps the order. */
body { margin: 0; background: #10201b; color: #fff; font: 16px system-ui, sans-serif; }
#p { padding: 16px; max-width: 560px; margin: 0 auto; }
#mik { display: block; width: 120px; height: 120px; margin: 12px auto; border-radius: 50%; border: 0; background: #3fbf93; color: #000; font-size: 18px; font-weight: 700; }
#mik.on { background: #e8604c; color: #fff; animation: p 1.2s infinite; }
@keyframes p { 50% { transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) { #mik.on { animation: none; } }
#m { color: #cfd8d3; text-align: center; min-height: 1.4em; }
#t { text-align: center; font-size: 20px; font-weight: 600; min-height: 1.5em; margin: 8px 0 12px; }
.a { display: block; width: 100%; text-align: left; font-size: 16px; padding: 12px; margin: 0 0 8px; border-radius: 10px; border: 0; background: #1f3a31; color: #fff; }
.a small { display: block; color: #a9bdb5; margin-top: 3px; }
#f { background: #1f3a31; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
#n { font-weight: 700; margin-bottom: 8px; }
input { font-size: 24px; width: 110px; padding: 8px; border-radius: 8px; border: 0; }
button.b { font-size: 18px; padding: 12px 16px; margin: 8px 8px 0 0; border-radius: 10px; border: 0; }
.g { background: #3fbf93; color: #000; }
.x { background: #444; color: #fff; }
</style>
</head>
<body>
<div id="p">
  <button id="mik" aria-label="Fol">Fol</button>
  <div id="m">Shtyp "Fol" dhe thuaj artikullin, p.sh. "kabell K453 dhjetë copë".</div>
  <div id="t"></div>
  <div id="f" hidden><div id="n"></div><input id="q" type="number" inputmode="numeric" min="0" placeholder="copë" aria-label="Sasia"><button class="b g" id="ok">Shto në porosi</button></div>
  <div id="l"></div>
  <button class="b x" id="mb">Mbaro</button>
</div>
<script>
const $ = (id) => document.getElementById(id);
const app = window.opener;
const dergo = (d) => { try { app.postMessage(d, '*'); } catch (e) {} };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, duke = false, cur = null;

const zgjidh = (a, sasia) => {
  cur = a.shifra; $('n').textContent = a.emri; $('q').value = sasia || a.sasia || ''; $('f').hidden = false; $('l').innerHTML = '';
  $('m').textContent = sasia ? 'Kontrollo sasinë dhe shtyp "Shto në porosi".' : 'Sa copë?'; if (!sasia) $('q').focus();
};
function nisDegjimin() {
  if (!app) { $('m').textContent = 'Hape nga aplikacioni i vizitave (butoni "Fol" te porosia).'; return; }
  if (!SR) { $('m').textContent = 'Ky shfletues nuk e njeh zërin. Përdor Chrome, ose mikrofonin e tastierës te fusha e kërkimit.'; return; }
  if (duke) { rec.stop(); return; }
  $('f').hidden = true; $('l').innerHTML = ''; $('t').textContent = ''; cur = null;
  rec = new SR(); rec.lang = 'sq-AL'; rec.interimResults = true; rec.maxAlternatives = 5; rec.continuous = false;
  let fund = null;
  rec.onstart = () => { duke = true; $('mik').classList.add('on'); $('mik').textContent = 'Po dëgjoj'; $('m').textContent = 'Fol tani…'; };
  rec.onresult = (e) => {
    const r = e.results[e.results.length - 1];
    $('t').textContent = r[0].transcript;
    if (r.isFinal) fund = Array.from(r).map((x) => x.transcript);
  };
  rec.onerror = (e) => {
    fund = null;
    $('m').textContent = e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'Mikrofoni është i bllokuar. Lejoje për këtë faqe te cilësimet e shfletuesit dhe provo sërish.'
      : e.error === 'no-speech' ? 'Nuk u dëgjua asgjë. Shtyp "Fol" dhe provo sërish.'
      : e.error === 'network' ? 'Njohja e zërit kërkon internet. Kontrollo lidhjen dhe provo sërish.'
      : e.error === 'language-not-supported' ? 'Ky telefon nuk e njeh shqipen. Përdor mikrofonin e tastierës te fusha e kërkimit.'
      : 'Zëri nuk u kuptua (' + e.error + '). Provo sërish.';
  };
  rec.onend = () => {
    duke = false; $('mik').classList.remove('on'); $('mik').textContent = 'Fol';
    if (fund) { $('m').textContent = 'Duke kërkuar…'; dergo({ lloji: 'ze-kerko', alternativa: fund }); }
  };
  try { rec.start(); } catch (e) { $('m').textContent = 'Zëri nuk u hap. Provo sërish.'; }
}
$('mik').onclick = nisDegjimin;
$('mb').onclick = () => window.close();
$('ok').onclick = () => {
  if (cur) dergo({ lloji: 'ze-sasia', shifra: cur, sasia: $('q').value });
  $('f').hidden = true; cur = null; $('t').textContent = ''; $('m').textContent = 'U shtua. Shtyp "Fol" për artikullin tjetër.';
};
$('q').onkeydown = (e) => { if (e.key === 'Enter') $('ok').click(); };

// Only the app window that opened this page may answer
addEventListener('message', (e) => {
  if (e.source !== app) return;
  const d = e.data || {};
  if (d.lloji !== 'ze-rezultat') return;
  const ar = d.artikuj || [];
  $('t').textContent = d.teksti || '';
  if (!ar.length) { $('m').textContent = 'Nuk u gjet asnjë artikull. Shtyp "Fol" dhe provo me emër tjetër ose me kodin.'; return; }
  if (ar.length === 1) { zgjidh(ar[0], d.sasia); return; }
  $('m').textContent = 'Zgjidh artikullin:';
  $('l').innerHTML = '';
  ar.forEach((a) => {
    const b = document.createElement('button'); b.className = 'a'; b.textContent = a.emri;
    const s = document.createElement('small'); s.textContent = a.info || ''; b.appendChild(s);
    b.onclick = () => zgjidh(a, d.sasia);
    $('l').appendChild(b);
  });
});
if (!app) $('m').textContent = 'Hape nga aplikacioni i vizitave (butoni "Fol" te porosia).';
else nisDegjimin();
</script>
</body>
</html>
