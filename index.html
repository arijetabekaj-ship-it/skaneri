<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skaneri i barkodeve</title>
<style>
/* Live barcode scanner for the visits app. It only reads barcodes: the app looks the item up and keeps the counts. */
body { margin: 0; background: #000; color: #fff; font: 16px system-ui, sans-serif; }
video { width: 100%; height: 58vh; object-fit: cover; display: block; background: #111; }
#p { padding: 14px; }
#m { color: #cfd8d3; min-height: 1.4em; }
#n { font-weight: 700; font-size: 18px; margin: 4px 0 10px; }
input { font-size: 24px; width: 110px; padding: 8px; border-radius: 8px; border: 0; }
button { font-size: 18px; padding: 12px 16px; margin: 8px 8px 0 0; border-radius: 10px; border: 0; }
.g { background: #3fbf93; color: #000; }
.x { background: #444; color: #fff; }
</style>
</head>
<body>
<video id="v" playsinline muted></video>
<div id="p">
  <div id="m">Duke hapur kamerën…</div>
  <div id="f" hidden><div id="n"></div><input id="q" type="number" inputmode="numeric" min="0" placeholder="copë"><button class="g" id="ok">OK</button></div>
  <button class="x" id="mb">Mbaro</button>
</div>
<script>
const $ = (id) => document.getElementById(id);
let pauz = false, fundit = '', kur = 0, cur = null;
const app = window.opener;
const dergo = (d) => { try { app.postMessage(d, '*'); } catch (e) {} };

$('mb').onclick = () => window.close();
$('ok').onclick = () => {
  if (cur) dergo({ lloji: 'sasia', shifra: cur, sasia: $('q').value });
  $('f').hidden = true; $('m').textContent = 'U ruajt. Skano artikullin tjetër…'; cur = null;
  setTimeout(() => { pauz = false; }, 600);
};
$('q').onkeydown = (e) => { if (e.key === 'Enter') $('ok').click(); };

// Only the app window that opened the scanner may answer
addEventListener('message', (e) => {
  if (e.source !== app) return;
  const d = e.data || {};
  if (d.lloji !== 'artikull') return;
  if (!d.shifra) { $('m').textContent = 'Barkodi ' + d.kod + ' nuk është në katalog. Skano tjetrin…'; setTimeout(() => { pauz = false; }, 1200); return; }
  cur = d.shifra; $('n').textContent = d.emri; $('q').value = d.sasia; $('f').hidden = false;
  $('m').textContent = 'Sa copë ka në raft?'; $('q').focus();
});

function gjeti(kod) {
  const t = Date.now();
  if (pauz || (kod === fundit && t - kur < 3000)) return;
  fundit = kod; kur = t; pauz = true;
  if (navigator.vibrate) navigator.vibrate(80);
  $('m').textContent = 'Barkodi: ' + kod;
  dergo({ lloji: 'kod', kod: kod });
}

(async () => {
  if (!app) { $('m').textContent = 'Hape skanerin nga aplikacioni i vizitave (butoni "Skano me kamerë").'; return; }
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = $('v'); v.srcObject = s; await v.play();
    $('m').textContent = 'Drejto kamerën te barkodi…';
    // The phone's own reader where it exists (Android Chrome), otherwise ZXing
    if ('BarcodeDetector' in window) {
      const bd = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'] });
      const loop = async () => { if (!pauz) { try { const r = await bd.detect(v); if (r.length) gjeti(r[0].rawValue); } catch (e) {} } setTimeout(loop, 250); };
      loop();
    } else {
      const sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js';
      sc.onload = () => { new ZXing.BrowserMultiFormatReader().decodeFromStream(s, v, (res) => { if (res) gjeti(res.getText()); }); };
      document.head.appendChild(sc);
    }
  } catch (e) {
    $('m').textContent = 'Kamera nuk u hap (' + e.name + '). Lejo kamerën për këtë faqe te cilësimet e shfletuesit dhe provo sërish.';
  }
})();
</script>
</body>
</html>
